name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Fetch Glyph Matrix SDK (if not committed)
        env:
          GLYPH_SDK_URL: ${{ vars.GLYPH_SDK_URL }}
        run: |
          if ! ls app/libs/*.aar >/dev/null 2>&1; then
            if [ -z "$GLYPH_SDK_URL" ]; then
              echo "::error::No .aar in app/libs and repo variable GLYPH_SDK_URL is not set"; exit 1
            fi
            curl -fsSL "$GLYPH_SDK_URL" -o app/libs/glyph-matrix-sdk.aar
          fi
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: GlyphStudio-debug
          path: app/build/outputs/apk/debug/*.apk
