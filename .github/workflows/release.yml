name: Build & Release APK

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      - name: Android SDK (preinstalled on runner)
        run: echo "ANDROID_HOME=$ANDROID_HOME" && test -d "$ANDROID_HOME"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Fetch Glyph Matrix SDK (if not committed)
        env:
          GLYPH_SDK_URL: ${{ vars.GLYPH_SDK_URL }}
        run: |
          if ! ls app/libs/*.aar >/dev/null 2>&1; then
            if [ -z "$GLYPH_SDK_URL" ]; then
              echo "::error::No .aar in app/libs and repo variable GLYPH_SDK_URL is not set"; exit 1
            fi
            curl -fsSL "$GLYPH_SDK_URL" -o app/libs/glyph-matrix-sdk.aar
          fi

      - name: Resolve version
        id: ver
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.${GITHUB_RUN_NUMBER}"; fi
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=$((GITHUB_RUN_NUMBER + 1))" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 secret missing — releases must use a stable key for the self-updater"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease --no-daemon \
            -PversionName=${{ steps.ver.outputs.name }} \
            -PversionCode=${{ steps.ver.outputs.code }}
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/GlyphStudio-v${{ steps.ver.outputs.name }}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: GlyphStudio-v${{ steps.ver.outputs.name }}
          path: dist/*

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          generate_release_notes: true
